# Site
title: Yile Liu
author: Yile Liu
description: "Compilers and operating systems."
email: liu_yi_le@icloud.com

# URL
url: "https://tofucurd.github.io"
baseurl: ""

# Build
permalink: pretty
future: true
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - package-lock.json
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - README.md
  - README.zh.md
  - _doc

defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: zh
